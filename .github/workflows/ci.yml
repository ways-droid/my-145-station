# Contrôles automatiques de my-145-station (pas de déploiement).
#
# Le déploiement sera ajouté quand le serveur de my-145-station et ses secrets existeront.
# config.php n'est jamais versionné.

name: Contrôles

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']   # 8.4 = version du sous-domaine de test chez ONE.COM
    name: tests (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, pdo_mysql, curl, mbstring, openssl, zip
          coverage: none

      - name: Contrôle PHP
        run: for f in api/*.php; do php -l "$f"; done

      - name: Contrôle JavaScript
        run: for f in js/*.js client/*.js; do node --check "$f"; done

      - name: Test de l'API
        run: TEST_PHP_LOG=$RUNNER_TEMP/php.log bash test/test.sh > /dev/null

      - name: Aucun avertissement PHP (Deprecated, Warning, Fatal)
        run: |
          if grep -aiE "deprecated|warning|fatal|parse error" "$RUNNER_TEMP/php.log"; then
            echo "::error::Avertissements PHP ${{ matrix.php }} dans le journal du serveur de test"; exit 1
          fi
