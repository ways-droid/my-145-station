<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my-145-station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Plan: sidebar app shell (nav à gauche, vue à droite); bleu nuit + accent bleu, neutres légèrement bleutés. */
:root {
  color-scheme: light;
  --bg: #f4f5f7;
  --panel: #ffffff;
  --ink: #12161f;
  --ink-2: #4d5566;
  --ink-3: #7b8394;
  --line: #e2e5eb;
  --accent: #2a5bd7;
  --accent-soft: #e8eefc;
  --nav: #141a2b;
  --nav-ink: #c9cfdc;
  --series-1: #2a78d6;
  --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --good: #1a7f4b; --good-bg: #e3f4ea;
  --warn: #9a6200; --warn-bg: #fdf1d8;
  --bad: #b42323; --bad-bg: #fbe5e5;
  --info: #2a5bd7; --info-bg: #e8eefc;
  --mute-bg: #eceef2;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f131c; --panel: #171c27; --ink: #eef0f4; --ink-2: #b4bbc9; --ink-3: #8790a2;
    --line: #283041; --accent: #6f95f0; --accent-soft: #1d2843; --nav: #0a0d14; --nav-ink: #aeb6c6;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --good: #5fcf92; --good-bg: #133524; --warn: #e8b04a; --warn-bg: #3a2c0e;
    --bad: #f07a7a; --bad-bg: #3d1717; --info: #8eacf3; --info-bg: #1d2843; --mute-bg: #222938;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f131c; --panel: #171c27; --ink: #eef0f4; --ink-2: #b4bbc9; --ink-3: #8790a2;
  --line: #283041; --accent: #6f95f0; --accent-soft: #1d2843; --nav: #0a0d14; --nav-ink: #aeb6c6;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --good: #5fcf92; --good-bg: #133524; --warn: #e8b04a; --warn-bg: #3a2c0e;
  --bad: #f07a7a; --bad-bg: #3d1717; --info: #8eacf3; --info-bg: #1d2843; --mute-bg: #222938;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100%; }
nav.side { background: var(--nav); color: var(--nav-ink); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: #fff; padding: 4px 10px 2px; letter-spacing: .02em; }
.brand-sub { font-size: 11.5px; color: var(--nav-ink); opacity: .7; padding: 0 10px 18px; }
nav.side a { color: var(--nav-ink); text-decoration: none; padding: 9px 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
nav.side a:hover { background: rgba(255,255,255,.06); color: #fff; }
nav.side a.on { background: rgba(255,255,255,.1); color: #fff; font-weight: 600; }
nav.side a .cnt { font-size: 11.5px; opacity: .7; font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; font-size: 11.5px; opacity: .65; padding: 10px; }
main { padding: 24px clamp(16px, 3vw, 36px) 48px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.head h1 { font-size: 26px; font-weight: 700; }
.head .sub { color: var(--ink-3); font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 13px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.btn-alert { background: #d92d20; border-color: #d92d20; color: #fff; font-weight: 600; }
.btn.btn-alert:hover:not(:disabled) { background: #b42318; border-color: #b42318; color: #fff; }
.head .lead-acts { flex: 1 1 auto; justify-content: center; }
@media (max-width: 900px) { .head .lead-acts { flex-basis: 100%; justify-content: flex-start; order: 2; } }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 13px; background: var(--warn-bg); color: var(--warn); }
.banner.info { background: var(--info-bg); color: var(--info); }
.banner.good { background: var(--green-bg); color: var(--green-ink); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.panel > h3 { font-size: 15px; font-weight: 600; padding: 14px 16px 0; }
.panel .pad { padding: 14px 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { padding: 14px 16px; }
.tile .lbl { font-size: 12.5px; color: var(--ink-2); }
.tile .val { font-family: var(--font-display); font-size: 26px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .note { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.tile .note.up { color: var(--good); } .tile .note.down { color: var(--bad); }
.tile.alert { border-left: 3px solid var(--bad); }
.grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 1100px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  nav.side { flex-direction: row; overflow-x: auto; padding: 10px; gap: 2px; }
  .brand-sub, .side-foot { display: none; } .brand { font-size: 17px; padding: 8px; }
  nav.side a { white-space: nowrap; } nav.side a .cnt { display: none; }
}
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover td { background: var(--accent-soft); }
td.r, th.r { text-align: right; }
.muted { color: var(--ink-3); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px; background: var(--mute-bg); color: var(--ink-2); white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.info { background: var(--info-bg); color: var(--info); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.df-bar { gap: 10px 14px; padding-top: 8px; padding-bottom: 10px; }
.df { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); }
.df select { padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 13px; max-width: 220px; }
.selbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 9px 14px; background: var(--accent-soft); border-bottom: 1px solid var(--line); font-size: 13.5px; }
.selbar .row-g { margin-left: auto; }
th.ck, td.ck { width: 34px; padding-right: 0 !important; }
td.ck input, th.ck input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
tr.sel td { background: var(--accent-soft); }
tfoot td { border-top: 2px solid var(--line); font-weight: 500; }
.toolbar input[type=search] { flex: 1 1 220px; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 11px; cursor: pointer; font-size: 13px; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.empty { padding: 36px 16px; text-align: center; color: var(--ink-3); }
.list-row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line); align-items: center; }
.list-row:first-of-type { border-top: 0; }
.bar-mini { height: 6px; background: var(--mute-bg); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar-mini > span { display: block; height: 100%; background: var(--series-1); border-radius: 3px; }
/* chart */
.chart-wrap { position: relative; padding: 8px 16px 14px; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); padding: 10px 16px 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.12); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 150px; display: none; z-index: 5; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; justify-content: space-between; gap: 12px; }
svg text { fill: var(--ink-3); font-size: 11px; font-family: var(--font-body); }
/* modal */
.overlay { position: fixed; inset: 0; background: rgba(10,14,24,.45); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; z-index: 20; overflow-y: auto; }
.modal { background: var(--panel); border-radius: 14px; width: min(760px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal.sm { width: min(440px, 100%); }
.modal header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal header h2 { font-size: 18px; }
.modal .body { padding: 18px 20px; display: grid; gap: 14px; }
.modal footer { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); }
.modal footer .left { margin-right: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.x { border: 0; background: transparent; font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink-3); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
label.f input, label.f select, label.f textarea, .lines input, .lines select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); width: 100%; min-width: 0; }
label.f textarea { min-height: 64px; resize: vertical; }
.lines td { padding: 6px 4px; border: 0; }
.lines th { padding: 6px 4px; }
.totals { display: grid; grid-template-columns: auto auto; justify-content: end; gap: 4px 24px; font-variant-numeric: tabular-nums; }
.totals .big { font-weight: 700; font-size: 16px; }
.totals > span:nth-child(even) { text-align: right; }
.err { color: var(--bad); font-size: 13px; }
/* invoice preview */
.doc-prev { border: 1px solid var(--line); border-radius: 10px; padding: 22px; background: var(--bg); display: grid; gap: 16px; }
.doc-prev .top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.doc-prev h2 { font-size: 20px; }
.ogm { font-family: var(--font-mono); font-size: 15px; font-weight: 500; letter-spacing: .03em; padding: 8px 12px; border: 1px dashed var(--ink-3); border-radius: 8px; display: inline-block; }
.toasts { position: fixed; bottom: 84px; right: 20px; z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; max-width: min(460px, calc(100vw - 40px)); pointer-events: none; }
.toast-i { display: flex; align-items: flex-start; gap: 10px; background: var(--ink); color: var(--panel); padding: 10px 10px 10px 14px; border-radius: 10px; font-size: 13.5px; line-height: 1.4; box-shadow: 0 8px 24px rgba(0,0,0,.22);
  opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: auto; }
.toast-i.show { opacity: 1; transform: none; }
.toast-x { background: none; border: 0; color: inherit; opacity: .6; font-size: 17px; line-height: 1; cursor: pointer; padding: 0 2px; }
.toast-x:hover { opacity: 1; }
body.ai-on .toasts { right: 460px; }
@media (max-width: 900px) { body.ai-on .toasts { right: 20px; bottom: 20px; } }
@media (prefers-reduced-motion: reduce) { .toast-i { transition: none; } }
.toast-log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 60vh; overflow-y: auto; font-size: 13.5px; }
.toast-log li { display: flex; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.msg-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer; margin-right: 8px; }
.msg-btn:hover { border-color: var(--accent); color: var(--ink); }
.msg-btn b { font-size: 11px; background: var(--bg); border-radius: 999px; padding: 1px 7px; color: var(--ink-3); }

/* ---- v2 ---- */
.nav-h { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; opacity: .5; padding: 14px 10px 4px; }
nav.side a .cnt { background: rgba(255,255,255,.14); border-radius: 999px; padding: 0 7px; opacity: 1; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.small { font-size: 12.5px; } .np { padding: 0 !important; margin-bottom: 8px; }
.pt { padding-top: 8px; } .pad { padding: 14px 16px; }
.stack { display: grid; gap: 14px; } .stack-s { display: grid; gap: 8px; }
.row-sb { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.row-g { display: flex; align-items: center; gap: 8px; } .wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
.txt-good { color: var(--good); } .txt-warn { color: var(--warn); } .txt-bad { color: var(--bad); }
.grid2.eq { grid-template-columns: 1fr 1fr; }
@media (max-width: 1100px) { .grid2.eq { grid-template-columns: 1fr; } }
/* onglets : barre en « pilules », icône + libellé + compteur ; l'onglet actif prend la couleur du module */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; margin: 6px 0 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,40,.05); }
.tabs button { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 8px 13px; border-radius: 10px; cursor: pointer; color: var(--ink-2); white-space: nowrap; font: inherit; font-size: 14px; font-weight: 600; transition: background .15s, color .15s, box-shadow .15s; }
.tabs button:hover { background: var(--accent-soft); color: var(--ink); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 35%, transparent); }
.tabs .tab-ic { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; opacity: .85; }
.tabs button.on .tab-ic { opacity: 1; }
.tabs .cnt { font-size: 12px; font-weight: 700; min-width: 22px; text-align: center; background: var(--mute-bg); border-radius: 999px; padding: 1px 7px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tabs .cnt.alert { background: var(--red); color: #fff; }
.tabs button.on .cnt { background: color-mix(in srgb, var(--accent-ink) 22%, transparent); color: var(--accent-ink); }
.tabs button.on .cnt.alert { background: #fff; color: var(--red); }
@media (max-width: 700px) { .tabs { flex-wrap: nowrap; overflow-x: auto; } .tabs button { padding: 8px 11px; } }
.ops { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 16px; }
.op { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 14px 16px; cursor: pointer; display: grid; gap: 3px; border-left: 4px solid var(--accent); }
.op:hover { background: var(--accent-soft); } .op b { font-size: 15px; } .op span { color: var(--ink-3); font-size: 12.5px; }
.op:disabled { opacity: .5; cursor: not-allowed; }
.tiles.mini { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.tile .val.sm { font-size: 18px; }
button.tile, a.tile { text-align: left; cursor: pointer; color: inherit; text-decoration: none; font: inherit; }
button.tile:hover, a.tile:hover { border-color: var(--accent); }
.dsec { margin-bottom: 26px; } .dsec > .row-sb { margin-bottom: 10px; } .dsec h2 { font-size: 18px; }
.dsec .grid2 { margin-bottom: 0; } .dsec .panel + .panel { margin-top: 0; }
.grid2.eq .dsec .panel { margin-bottom: 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.vcard { text-align: left; padding: 14px 16px; display: grid; gap: 8px; cursor: pointer; font: inherit; color: inherit; }
.vcard:hover { border-color: var(--accent); }
.plate { font-family: var(--font-mono); font-weight: 500; border: 1.5px solid var(--ink-2); border-radius: 5px; padding: 1px 7px; font-size: 13px; letter-spacing: .04em; color: var(--bad); background: var(--panel); }
.plate.sm { font-size: 11.5px; padding: 0 5px; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
dl.kv dt { color: var(--ink-3); } dl.kv dd { margin: 0; } dl.kv.sm { font-size: 12.5px; gap: 3px 12px; }
.modal.lg { width: min(980px, 100%); } .modal h3 { font-size: 15px; margin-top: 4px; }
.modal header h2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
label.f.wide { grid-column: 1 / -1; }
.hint { font-size: 12px; color: var(--ink-3); }
.scanbox { border: 1.5px dashed var(--accent); border-radius: 12px; padding: 12px; background: var(--accent-soft); }
.scanrow { display: flex; gap: 8px; } .scanrow input { flex: 1; font-size: 16px !important; padding: 10px 12px !important; }
.cam { display: inline-flex; align-items: center; }
.scanlist { display: grid; gap: 6px; max-height: 340px; overflow-y: auto; }
.scanitem { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; border-left: 4px solid var(--line); background: var(--bg); }
.scanitem.ok { border-color: var(--good); } .scanitem.new { border-color: var(--info); background: var(--info-bg); }
.scanitem.warn { border-color: var(--warn); background: var(--warn-bg); } .scanitem.err { border-color: var(--bad); background: var(--bad-bg); }
.scanitem input { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); min-width: 120px; flex: 1; }
.checklist { display: grid; gap: 4px; max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
label.chk { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; flex-wrap: wrap; }
label.chk:hover { background: var(--bg); }
.timeline { display: grid; gap: 6px; border-left: 2px solid var(--line); padding-left: 12px; font-size: 13px; }
.quote { background: var(--bg); border-left: 3px solid var(--ink-3); padding: 10px 12px; border-radius: 6px; white-space: pre-wrap; }
.photo { max-width: 100%; max-height: 320px; border-radius: 10px; }
.photos { display: flex; gap: 8px; flex-wrap: wrap; }
.photos img { width: 110px; height: 110px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
.addphoto { width: 110px; height: 110px; border: 1.5px dashed var(--ink-3); border-radius: 10px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
details summary { cursor: pointer; color: var(--accent); font-weight: 500; }

.nt-share { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---- Tableau de bord à widgets ---- */
.wgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
.wdg { grid-column: span 6; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,40,.05); border-top: 4px solid var(--tc, var(--accent)); display: flex; flex-direction: column; min-width: 0; }
.wdg.w-s { grid-column: span 3; } .wdg.w-m { grid-column: span 6; } .wdg.w-l { grid-column: span 12; }
@media (max-width: 1250px) { .wdg.w-s { grid-column: span 6; } }
@media (max-width: 800px) { .wdg.w-s, .wdg.w-m, .wdg.w-l { grid-column: span 12; } }
.w-h { display: flex; align-items: center; gap: 9px; padding: 12px 16px 6px; }
.w-h h3 { margin: 0; font-size: 15px; flex: 1; }
.w-ic { width: 30px; height: 30px; border-radius: 9px; display: inline-grid; place-items: center; background: color-mix(in srgb, var(--tc, var(--accent)) 14%, transparent); font-size: 16px; flex: none; }
.w-b { padding: 6px 16px 14px; display: grid; gap: 10px; min-width: 0; }
.tfa-qr { display: grid; place-items: center; } .tfa-qr svg { width: 180px; height: 180px; background: #fff; border-radius: 8px; padding: 4px; }
.tfa-key { display: inline-block; letter-spacing: 1px; user-select: all; word-break: break-all; }
.tfa-rec { font-family: var(--font-mono, monospace); font-size: 15px; line-height: 1.6; background: var(--bg); border-radius: 8px; padding: 10px 14px; margin: 0; columns: 2; user-select: all; }
.pay-btn { background: var(--good, #1a7f4b); color: #fff; border-color: transparent; }
.docnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; padding: 6px 8px; background: var(--bg); border-radius: 10px; }
.docnav .btn[disabled] { opacity: .4; cursor: default; }
.w-sales-top { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.w-big { font-family: var(--font-display); font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.w-trend { font-size: 12px; font-weight: 600; } .w-trend.up { color: var(--good); } .w-trend.down { color: var(--bad); }
.w-spark { width: 100%; height: 74px; } .w-spark path { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.w-spark .s0 { stroke: var(--ink-3); stroke-dasharray: 3 3; } .w-spark .s1 { stroke: var(--series-1); }
.w-legend { display: flex; gap: 12px; color: var(--ink-3); } .w-legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.w-bar { display: grid; grid-template-columns: minmax(0,1fr) 40% auto; gap: 8px; align-items: center; font-size: 13px; margin: 3px 0; }
.w-bar-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .w-bar-t { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; } .w-bar-t i { display: block; height: 100%; background: var(--series-1); border-radius: 4px; }
.w-stats { display: flex; flex-wrap: wrap; gap: 8px; }
.w-stat { flex: 1 1 90px; background: var(--bg); border-radius: 10px; padding: 9px 11px; display: grid; gap: 1px; min-width: 0; }
.w-stat b { font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.w-stat span { font-size: 12px; color: var(--ink-3); }
.w-stat.good b { color: var(--good); } .w-stat.warn b { color: var(--warn); } .w-stat.bad b { color: var(--bad); }
.w-list .list-row { padding: 7px 0; } .w-empty { color: var(--ink-3); font-size: 13.5px; padding: 6px 0; }
.w-more { font-size: 13px; font-weight: 600; justify-self: end; color: var(--tc, var(--accent)); text-decoration: none; }
.w-more:hover { text-decoration: underline; }
.wdg .chart-wrap svg { max-height: 280px; }
.w-short { display: flex; flex-wrap: wrap; gap: 8px; }
.w-notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.w-note { text-align: left; font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; cursor: pointer; display: grid; gap: 3px; background: var(--panel); }
.w-note span { font-size: 12.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
.wgrid.editing .wdg { cursor: grab; outline: 2px dashed color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 3px; }
.wgrid.editing .wdg .w-b { pointer-events: none; opacity: .85; }
.wdg.dragging { opacity: .4; } .wdg.drop-before { box-shadow: -5px 0 0 0 var(--accent); }
.w-tools { display: inline-flex; align-items: center; gap: 6px; } .w-tools .seg button { padding: 3px 8px; font-size: 12px; }
.w-cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; margin-top: 6px; }
.w-pick { display: flex; align-items: center; gap: 10px; text-align: left; font: inherit; color: inherit; border: 1px solid var(--line); border-left: 4px solid var(--tc, var(--accent)); border-radius: 10px; background: var(--panel); padding: 10px 12px; cursor: pointer; }
.w-pick > span:nth-child(2) { flex: 1; display: grid; gap: 2px; } .w-pick .w-st { font-size: 12px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.w-pick.on { opacity: .6; cursor: default; } .w-pick.on .w-st { color: var(--good); }
.w-pick:not(.on):hover { box-shadow: 0 3px 10px rgba(0,0,0,.08); }

/* grille libre GridStack */
